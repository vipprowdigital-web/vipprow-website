# Builds the website (website/) on GitHub's servers, pushes the image to
# GitHub Container Registry (ghcr.io), then tells Coolify to deploy it.
# Coolify only pulls and restarts the ready-made image, so the slow build no
# longer runs on the hosting server.
#
# Setup (once), in GitHub → repo Settings → Secrets and variables → Actions:
#   Variables: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_CROISSIX_API_URL
#   Secrets:   COOLIFY_WEBHOOK (the app's Deploy Webhook URL in Coolify)
#              COOLIFY_TOKEN   (Coolify → Keys & Tokens → API token, "deploy")
# And in Coolify, the website app must deploy from the Docker image
# ghcr.io/<owner>/vipprow-website:latest instead of building from Git.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push cancels a deploy that's still building
concurrency:
  group: deploy-website
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vipprow-website

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check required settings
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_API_URL is not set"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: website
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # NEXT_PUBLIC_* values are baked into the site at build time
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CROISSIX_API_URL=${{ vars.NEXT_PUBLIC_CROISSIX_API_URL }}
          # Reuse unchanged layers (e.g. npm install) between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Skipped (with a warning) until both Coolify secrets are added, so the
      # image can be built once before Coolify is switched over to it.
      - name: Tell Coolify to deploy the new image
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK / COOLIFY_TOKEN not set — image built and pushed, but not deployed."
            exit 0
          fi
          # Coolify's deploy webhook only accepts POST now
          curl -X POST --fail-with-body --show-error --silent --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
